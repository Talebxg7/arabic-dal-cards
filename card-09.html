<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بطاقة أولاد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700&display=swap">
<style>
/* layout: one flash card centred on a quiet field; picture above, word below, like the printed card */
:root{
  color-scheme:light;
  --bg:#e8f1f8; --fg:#16303f; --muted:#4d6676; --accent:#d6232a; --card:#ffffff; --line:#7f98a8;
  --display:"Baloo Bhaijaan 2","Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#10222d;--fg:#e6f0f6;--muted:#9db6c5;--accent:#ff6a70;--line:#6b8798;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10222d;--fg:#e6f0f6;--muted:#9db6c5;--accent:#ff6a70;--line:#6b8798;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--display)}
main{min-height:100vh;box-sizing:border-box;padding-inline:16px;padding-block:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.kicker{margin:0;font-size:1.15rem;font-weight:600;color:var(--muted);text-align:center;text-wrap:balance}
.card{width:min(100%,380px);background:var(--card);border-radius:18px;padding:12px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;box-shadow:0 2px 0 var(--line),0 14px 30px -16px rgba(0,0,0,.45)}
.box{border:2px dashed #8b8b8b;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;padding:10px;box-sizing:border-box}
.box img{display:block;width:100%;height:auto;max-width:100%}
.pic img{max-height:min(52vh,330px);width:auto;object-fit:contain}
.word img{max-height:150px;width:auto;object-fit:contain}
.hint{margin:0;font-size:1.05rem;color:var(--muted);text-align:center}
.hint b{color:var(--accent);font-weight:700}
body{margin:0}
img{max-width:100%}
</style>
</head>
